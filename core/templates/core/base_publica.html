{% extends "core/base.html" %}
{% block cuerpo %}
<div class="row g-0 min-vh-100">
  <aside class="col-lg-5 d-none d-lg-flex panel-marca">
    <div>
      <span class="marca"><i class="bx bxs-bell-ring" aria-hidden="true"></i> Novedades</span>
      <h1>Las novedades del centro, con su evidencia, en un solo registro.</h1>
      <ul>
        <li><i class="bx bx-book-open" aria-hidden="true"></i> Académicas</li>
        <li><i class="bx bx-shield-x" aria-hidden="true"></i> Disciplinarias</li>
        <li><i class="bx bx-building" aria-hidden="true"></i> De ambiente</li>
      </ul>
    </div>
  </aside>
  <main class="col-lg-7 d-flex align-items-center justify-content-center p-4">
    <div class="tarjeta-publica w-100{% block ancho %}{% endblock %}">
      {% include "core/_mensajes.html" %}
      {% block contenido %}{% endblock %}
    </div>
  </main>
</div>
{% endblock %}
